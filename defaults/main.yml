---
postgresql_version: "14"
postgresql_database: appdb
postgresql_user: appuser
postgresql_password: ""
postgresql_port: 5432
postgresql_listen_addresses: "*"
postgresql_pg_hba_address: "0.0.0.0/0"
postgresql_service_name: postgresql
postgresql_package_name: "postgresql-{{ postgresql_version }}"
postgresql_client_package_name: "postgresql-client-{{ postgresql_version }}"
postgresql_config_path: "/etc/postgresql/{{ postgresql_version }}/main/postgresql.conf"
postgresql_hba_path: "/etc/postgresql/{{ postgresql_version }}/main/pg_hba.conf"
