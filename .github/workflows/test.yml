name: PostgreSQL role tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  postgresql:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Ansible
        run: python -m pip install ansible==8.7.0
      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml
      - name: Check playbook syntax
        run: ansible-playbook --syntax-check tests/test.yml
      - name: Install, repeat configuration, and verify database login
        run: ansible-playbook -i tests/inventory tests/test.yml
